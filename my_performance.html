<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Performance - M-Sales</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/layout.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body>
    <div id="app"></div>

    <script>
        initLayout('My Performance');

        const appContainer = document.querySelector('#app > div > div');
        const main = document.createElement('div');
        main.className = "flex-1 bg-gray-50";

        main.innerHTML = `
            <!-- Header -->
            <div class="bg-white border-b border-gray-200 px-6 py-4">
                <h1 class="text-2xl font-semibold text-gray-800">My Performance</h1>
            </div>

            <!-- Content -->
            <div class="p-6">
                <div class="bg-white rounded-lg shadow-sm">
                    <!-- Search and Filters -->
                    <div class="p-4 border-b border-gray-200 flex items-center gap-4 flex-wrap">
                        <div class="relative flex-1 max-w-xs">
                             <i data-lucide="search" class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 w-4 h-4"></i>
                            <input
                                type="text"
                                placeholder="Search"
                                class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                            />
                        </div>

                        <div class="relative">
                            <select class="pl-4 pr-10 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white text-gray-700 appearance-none cursor-pointer min-w-[180px]">
                                <option value="all">All Types</option>
                                <option value="cc">Credit Card</option>
                                <option value="merchant">Merchant</option>
                                <option value="telemarketing">Telemarketing</option>
                                <option value="pemol">PEMOL</option>
                            </select>
                            <i data-lucide="chevron-down" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 w-4 h-4 pointer-events-none"></i>
                        </div>

                        <div class="relative">
                            <i data-lucide="calendar" class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 w-4 h-4"></i>
                            <input
                                type="text"
                                placeholder="Select date range"
                                class="pl-10 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white"
                            />
                        </div>

                        <div class="ml-auto">
                            <button class="flex items-center gap-2 px-4 py-2 bg-[#3B6EC2] text-white rounded-lg text-sm hover:bg-[#2f5a9f] transition-colors">
                                <i data-lucide="download" class="w-4 h-4"></i>
                                Export data
                            </button>
                        </div>
                    </div>

                    <!-- Table -->
                    <div class="overflow-x-auto">
                        <table class="w-full">
                            <thead>
                                <tr class="bg-[#3B6EC2] text-white">
                                    <th class="px-4 py-3 text-center text-sm font-medium">No</th>
                                    <th class="px-4 py-3 text-left text-sm font-medium">Sales Name</th>
                                    <th class="px-4 py-3 text-left text-sm font-medium">NIK</th>
                                    <th class="px-4 py-3 text-left text-sm font-medium">Branch</th>
                                    <th class="px-4 py-3 text-center text-sm font-medium">CC</th>
                                    <th class="px-4 py-3 text-center text-sm font-medium">Merchant</th>
                                    <th class="px-4 py-3 text-center text-sm font-medium">Telemarketing</th>
                                    <th class="px-4 py-3 text-center text-sm font-medium">PEMOL</th>
                                    <th class="px-4 py-3 text-center text-sm font-medium">Total App</th>
                                    <th class="px-4 py-3 text-center text-sm font-medium border-l border-white/20">Action</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody">
                                <!-- JS Populated -->
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination -->
                    <div class="px-4 py-3 border-t border-gray-200 flex items-center justify-between bg-gray-50">
                        <div class="text-sm text-gray-600">Showing 1 to 8 of 8</div>

                         <div class="flex items-center gap-2">
                            <button class="w-8 h-8 flex items-center justify-center text-gray-400 hover:bg-gray-200 rounded transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                                &lt;
                            </button>
                            <button class="w-8 h-8 flex items-center justify-center bg-[#3B6EC2] text-white rounded font-medium text-sm">1</button>
                            <button class="w-8 h-8 flex items-center justify-center text-gray-400 hover:bg-gray-200 rounded transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                                &gt;
                            </button>
                        </div>

                         <div class="flex items-center gap-2">
                            <span class="text-sm text-gray-600">Show</span>
                            <select class="border border-gray-300 px-3 py-1.5 rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                                <option value="10">10</option>
                                <option value="25">25</option>
                                <option value="50">50</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        `;

        appContainer.appendChild(main);

        const data = [
            { id: 1, salesName: 'Ahmad Hidayat', nik: 'K1104532', branch: 'Jakarta Pusat', cc: 45, merchant: 32, telemarketing: 18, pemol: 24, totalApp: 119 },
            { id: 2, salesName: 'Siti Nurhaliza', nik: 'K1105621', branch: 'Bandung', cc: 52, merchant: 28, telemarketing: 22, pemol: 31, totalApp: 133 },
            { id: 3, salesName: 'Budi Santoso', nik: 'K1106743', branch: 'Surabaya', cc: 38, merchant: 41, telemarketing: 15, pemol: 19, totalApp: 113 },
            { id: 4, salesName: 'Dewi Kusuma', nik: 'K1107854', branch: 'Medan', cc: 47, merchant: 35, telemarketing: 20, pemol: 28, totalApp: 130 },
            { id: 5, salesName: 'Eko Prasetyo', nik: 'K1108965', branch: 'Semarang', cc: 41, merchant: 29, telemarketing: 17, pemol: 22, totalApp: 109 },
            { id: 6, salesName: 'Fitri Handayani', nik: 'K1109076', branch: 'Makassar', cc: 55, merchant: 38, telemarketing: 25, pemol: 33, totalApp: 151 },
            { id: 7, salesName: 'Gunawan Wijaya', nik: 'K1110187', branch: 'Palembang', cc: 43, merchant: 31, telemarketing: 19, pemol: 26, totalApp: 119 },
            { id: 8, salesName: 'Hani Rahmawati', nik: 'K1111298', branch: 'Denpasar', cc: 49, merchant: 36, telemarketing: 21, pemol: 29, totalApp: 135 }
        ];

        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = data.map((item, index) => `
            <tr class="border-b border-gray-200 hover:bg-gray-50 ${index % 2 === 0 ? 'bg-white' : 'bg-gray-50'}">
                <td class="px-4 py-3 text-sm text-gray-700 text-center">${item.id}</td>
                <td class="px-4 py-3 text-sm text-gray-700">${item.salesName}</td>
                <td class="px-4 py-3 text-sm text-gray-700">${item.nik}</td>
                <td class="px-4 py-3 text-sm text-gray-700">${item.branch}</td>
                <td class="px-4 py-3 text-sm text-gray-700 text-center">${item.cc}</td>
                <td class="px-4 py-3 text-sm text-gray-700 text-center">${item.merchant}</td>
                <td class="px-4 py-3 text-sm text-gray-700 text-center">${item.telemarketing}</td>
                <td class="px-4 py-3 text-sm text-gray-700 text-center">${item.pemol}</td>
                <td class="px-4 py-3 text-sm text-gray-700 text-center font-semibold">${item.totalApp}</td>
                <td class="px-4 py-3 text-center border-l border-gray-200">
                     <button class="text-gray-400 hover:text-gray-600">
                        <i data-lucide="more-horizontal" class="w-5 h-5"></i>
                    </button>
                </td>
            </tr>
        `).join('');

        lucide.createIcons();
    </script>
</body>

</html>
