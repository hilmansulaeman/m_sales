            const end = start + rowsPerPage;
            const paginatedData = filteredData.slice(start, end);

            tbody.innerHTML = paginatedData.map((row, index) => `
                <tr class="hover:bg-gray-50 transition-colors">
                    <td class="px-4 py-3 text-sm text-gray-700 text-center">${start + index + 1}</td>
                    <td class="px-4 py-3 text-sm text-gray-900 font-medium">${row.rsmName}</td>
                    <td class="px-4 py-3 text-sm text-gray-700">${row.nikSales}</td>
                    <td class="px-4 py-3 text-sm text-center text-gray-700">${row.myBCA}</td>
                    <td class="px-4 py-3 text-sm text-center text-gray-700">${row.mobileBCA}</td>
                    <td class="px-4 py-3 text-sm text-center text-gray-700">${row.ne}</td>
                    <td class="px-4 py-3 text-sm text-center text-gray-700">${row.sk}</td>
                    <td class="px-4 py-3 text-sm text-center text-gray-700">${row.ktb}</td>
                    <td class="px-4 py-3 text-sm text-center text-gray-900 font-semibold">${row.total}</td>
                    <td class="px-4 py-3 text-center">
                        <button onclick="openDetailModal('${row.rsmName}')" class="text-[#3B6EC2] hover:text-[#2F5BA8] transition-colors inline-flex items-center justify-center">
                            <i data-lucide="eye" class="w-5 h-5"></i>
                        </button>
                    </td>
                </tr>
            `).join("");

            if (paginatedData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="10" class="text-center py-8 text-gray-500">No data found</td></tr>`;
            }
            lucide.createIcons();
        }

        function renderPagination() {
            const totalPages = Math.ceil(filteredData.length / rowsPerPage);
            const showingInfo = document.getElementById("showingInfo");
            const paginationControls = document.getElementById("paginationControls");

            const start = filteredData.length === 0 ? 0 : (currentPage - 1) * rowsPerPage + 1;
            const end = Math.min(currentPage * rowsPerPage, filteredData.length);
            showingInfo.textContent = `Showing ${start} to ${end} of ${filteredData.length}`;

            let controlsHtml = `
                <button onclick="changePage(${currentPage - 1})" class="p-1 hover:text-gray-700 text-gray-400 transition-colors ${currentPage === 1 ? 'opacity-50 cursor-not-allowed' : ''}" ${currentPage === 1 ? 'disabled' : ''}>
                    <i data-lucide="chevron-left" class="w-4 h-4"></i>
                </button>
            `;

            for (let i = 1; i <= totalPages; i++) {
                if (i === currentPage) {
                    controlsHtml += `<span class="w-8 h-8 flex items-center justify-center bg-blue-100 text-blue-600 font-medium rounded-lg">${i}</span>`;
                } else {
                    controlsHtml += `<button onclick="changePage(${i})" class="w-8 h-8 flex items-center justify-center hover:bg-gray-100 text-gray-600 rounded-lg transition-colors">${i}</button>`;
                }
            }

            controlsHtml += `
                <button onclick="changePage(${currentPage + 1})" class="p-1 hover:text-gray-700 text-gray-400 transition-colors ${currentPage === totalPages || totalPages === 0 ? 'opacity-50 cursor-not-allowed' : ''}" ${currentPage === totalPages || totalPages === 0 ? 'disabled' : ''}>
                    <i data-lucide="chevron-right" class="w-4 h-4"></i>
                </button>
            `;
            paginationControls.innerHTML = controlsHtml;
            lucide.createIcons();
        }

        window.handleSearch = function (query) {
            searchQuery = query.toLowerCase();
            filteredData = mainData.filter(item =>
                item.rsmName.toLowerCase().includes(searchQuery) ||
                item.nikSales.toLowerCase().includes(searchQuery)
            );
            currentPage = 1;
            renderTable();
            renderPagination();
        }

        window.changePage = function (page) {
            const totalPages = Math.ceil(filteredData.length / rowsPerPage);
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderTable();
            renderPagination();
        }

        window.handleRowsPerPageChange = function (value) {
            rowsPerPage = parseInt(value);
            currentPage = 1;
            renderTable();
            renderPagination();
        }

        // Modal Logic
        window.openDetailModal = function (rsmName) {
            document.getElementById("modalTitle").innerText = rsmName;
            document.getElementById("detailModal").classList.remove("hidden");
            renderModalTable();
            lucide.createIcons(); // Re-init icons inside modal
        };

        window.closeDetailModal = function () {
            document.getElementById("detailModal").classList.add("hidden");
        };

        function renderModalTable() {
            const modalTbody = document.getElementById("modalTableBody");
            modalTbody.innerHTML = asmData
                .map(
                    (item, index) => `
                <tr class="hover:bg-blue-50/50 transition-colors group">
                    <td class="px-6 py-4 text-sm text-gray-600 text-center border-r border-gray-100">${index + 1}</td>
                    <td class="px-6 py-4 text-sm text-gray-900 font-medium border-r border-gray-100">${item.asmName}</td>
                    <td class="px-6 py-4 text-sm text-gray-600 text-left border-r border-gray-100">${item.nikSales}</td>
                    <td class="px-6 py-4 text-sm text-gray-600 text-center border-r border-gray-100">${item.myBCA}</td>
                    <td class="px-6 py-4 text-sm text-gray-600 text-center border-r border-gray-100">${item.mobileBCA}</td>
                    <td class="px-6 py-4 text-sm text-gray-600 text-center border-r border-gray-100">${item.ne}</td>
                    <td class="px-6 py-4 text-sm text-gray-600 text-center border-r border-gray-100">${item.sk}</td>
                    <td class="px-6 py-4 text-sm text-gray-600 text-center border-r border-gray-100">${item.ktb}</td>
                    <td class="px-6 py-4 text-sm font-bold text-gray-900 text-center">${item.total}</td>
                </tr>
            `
                )
                .join("");
        }

        // Date Range Picker Logic
        window.toggleDateRangePicker = function (event) {
            if (event) event.stopPropagation();
            const picker = document.getElementById("dateRangePicker");
            picker.classList.toggle("hidden");
        };

        document.addEventListener("click", function (event) {
            const datePicker = document.getElementById("dateRangePicker");
            const dateInput = event.target.closest(
                '[onclick*="toggleDateRangePicker"]'
            );
            if (
                datePicker &&
                !datePicker.classList.contains("hidden") &&
                !datePicker.contains(event.target) &&
                !dateInput
            ) {
                datePicker.classList.add("hidden");
            }
        });

        lucide.createIcons();
    </script>
</body>

</html>
