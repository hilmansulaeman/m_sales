<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring - M-Sales</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/layout.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body>
    <div id="app"></div>

    <script>
        initLayout('Monitoring');

        const appContainer = document.querySelector('#app > div > div');
        const main = document.createElement('div');
        main.className = "flex-1 bg-gray-50 flex flex-col";

        main.innerHTML = `
            <!-- Header -->
            <div class="bg-white border-b border-gray-200 px-6 py-4">
                <h1 class="text-2xl font-semibold text-[#3B6EC2]">Monitoring</h1>
            </div>

            <!-- Content -->
            <div class="flex-1 p-6">
                <div class="bg-white rounded-lg shadow-sm">
                    <!-- Table -->
                    <div class="overflow-x-auto">
                        <table class="w-full">
                            <thead class="bg-[#3B6EC2]">
                                <tr>
                                    <th class="px-6 py-3 text-left text-white text-sm font-semibold"></th>
                                    <th class="px-6 py-3 text-left text-white text-sm font-semibold">Target</th>
                                    <th class="px-6 py-3 text-left text-white text-sm font-semibold">Actual</th>
                                    <th class="px-6 py-3 text-left text-white text-sm font-semibold">Difference</th>
                                    <th class="px-6 py-3 text-left text-white text-sm font-semibold">Action</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody" class="divide-y divide-gray-200">
                                <!-- Populated via JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        `;

        appContainer.appendChild(main);

        const monitoringData = [
            { id: 1, label: "Summary RSM", target: 150, actual: 142, difference: -8 },
            { id: 2, label: "Summary ASM", target: 280, actual: 265, difference: -15 },
            { id: 3, label: "Application", target: 450, actual: 438, difference: -12 },
            { id: 4, label: "Account", target: 320, actual: 315, difference: -5 },
            { id: 5, label: "RTS", target: 95, actual: 88, difference: -7 },
            { id: 6, label: "Under Performance", target: 25, actual: 32, difference: 7 },
            { id: 7, label: "Approval Rate", target: 85, actual: 82, difference: -3 }
        ];

        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = monitoringData.map((data) => `
            <tr class="hover:bg-gray-50">
                <td class="px-6 py-4 text-sm font-medium text-gray-900">${data.label}</td>
                <td class="px-6 py-4 text-sm text-gray-700">${data.target}</td>
                <td class="px-6 py-4 text-sm">
                    <span class="inline-flex items-center px-3 py-1 rounded-full bg-[#3B6EC2] text-white text-sm font-medium">
                        ${data.actual}
                    </span>
                </td>
                <td class="px-6 py-4 text-sm">
                    <span class="font-medium ${data.difference < 0 ? 'text-red-600' : 'text-green-600'}">
                        ${data.difference > 0 ? '+' : ''}${data.difference}
                    </span>
                </td>
                <td class="px-6 py-4 text-sm">
                    <button class="flex items-center gap-2 px-4 py-2 bg-[#3B6EC2] text-white rounded-lg text-sm hover:bg-[#2F5BA8] transition-colors">
                        <i data-lucide="eye" class="w-4 h-4"></i>
                    </button>
                </td>
            </tr>
        `).join('');

        lucide.createIcons();
    </script>
</body>

</html>
