<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Check Pemol - M-Sales</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/layout.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body>
    <div id="app"></div>

    <script>
        // Initialize Layout
        initLayout('Application Check - Pemol');

        // Render Page Content
        const appContainer = document.querySelector('#app > div > div'); // Main content wrapper
        const main = document.createElement('main');
        main.className = "flex-1 p-4 lg:p-6";

        main.innerHTML = `
            <!-- Blue Info Section -->
            <div class="bg-[#3B6EC2] rounded-lg p-8 mb-6">
                <p class="text-white text-center text-lg mb-6">
                    Please enter your account number in the field below
                </p>

                <!-- Search Input -->
                <div class="max-w-3xl mx-auto">
                    <div class="relative">
                        <i data-lucide="search" class="absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400 w-5 h-5"></i>
                        <input
                            type="text"
                            id="accountNumberInput"
                            placeholder="Search"
                            class="w-full pl-12 pr-4 py-3 rounded-full border-0 bg-white text-base focus:outline-none focus:ring-2 focus:ring-white/50 text-black placeholder-gray-400"
                            onkeydown="handleSearchKey(event)"
                        />
                    </div>
                </div>
            </div>

            <!-- Search Results Section (Hidden by default) -->
            <div id="searchResults" class="hidden">
                 <!-- Tabs -->
                <div class="flex flex-col sm:flex-row gap-2 mb-4">
                    <button
                        onclick="switchLocalTab('incoming')"
                        id="tab-incoming"
                        class="px-6 py-2 text-sm font-medium rounded-lg transition-colors bg-[#3B6EC2] text-white"
                    >
                        Data Incoming PEMOL
                    </button>
                    <button
                        onclick="switchLocalTab('approval')"
                        id="tab-approval"
                        class="px-6 py-2 text-sm font-medium rounded-lg transition-colors bg-blue-50 text-[#3B6EC2] hover:bg-blue-100"
                    >
                        Data Approval PEMOL
                    </button>
                </div>

                <!-- Table Container -->
                <div class="bg-white rounded-lg shadow">
                    <div class="overflow-x-auto">
                        <table class="w-full">
                            <thead>
                                <tr class="bg-[#3B6EC2]">
                                    <th class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">No</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">Account Number</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">Sales Code</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">Input Date</th>
                                </tr>
                            </thead>
                            <tbody class="bg-white divide-y divide-gray-200" id="tableBody">
                                <!-- Populated by JS -->
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination -->
                    <div class="px-6 py-4 border-t border-gray-200 flex items-center justify-between">
                         <div class="flex items-center gap-2 text-sm text-gray-700">
                            Showing <span id="showingStart">1</span> to <span id="showingEnd">1</span> of <span id="totalRows">1</span>
                        </div>
                        <div class="flex items-center gap-4">
                            <!-- Pagination Controls -->
                            <div class="flex items-center gap-1">
                                <button class="p-1 rounded hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed">
                                    <i data-lucide="chevron-left" class="w-5 h-5 text-gray-600"></i>
                                </button>
                                <button class="px-3 py-1 bg-[#3B6EC2] text-white rounded text-sm font-medium">1</button>
                                <button class="p-1 rounded hover:bg-gray-100">
                                   <i data-lucide="chevron-right" class="w-5 h-5 text-gray-600"></i>
                                </button>
                            </div>

                            <!-- Show Dropdown -->
                            <div class="flex items-center gap-2">
                                <span class="text-sm text-gray-700">Show</span>
                                <div class="relative">
                                    <select class="appearance-none bg-white border border-gray-300 rounded px-3 py-1 pr-8 text-sm focus:outline-none focus:ring-2 focus:ring-[#3B6EC2]">
                                        <option value="10">10</option>
                                        <option value="25">25</option>
                                        <option value="50">50</option>
                                        <option value="100">100</option>
                                    </select>
                                    <i data-lucide="chevron-down" class="absolute right-2 top-1/2 transform -translate-y-1/2 w-4 h-4 text-gray-400 pointer-events-none"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        `;

        appContainer.appendChild(main);
        lucide.createIcons();

        // Logic
        function handleSearchKey(e) {
            if (e.key === 'Enter') {
                performSearch();
            }
        }

        function performSearch() {
            const input = document.getElementById('accountNumberInput').value;
            if (input.trim()) {
                document.getElementById('searchResults').classList.remove('hidden');

                // Mock Data
                const data = [
                    { no: 1, accountNumber: input, salesCode: "SC001", inputDate: "06-Aug-2024 | 21:04:36" }
                ];

                const tbody = document.getElementById('tableBody');
                tbody.innerHTML = data.map(row => `
                     <tr class="hover:bg-gray-50">
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${row.no}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${row.accountNumber}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${row.salesCode}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${row.inputDate}</td>
                    </tr>
                `).join('');

                // Refresh Icons inside table (if any, though none used yet)
                lucide.createIcons();
            }
        }

        function switchLocalTab(tabName) {
            const tabIncoming = document.getElementById('tab-incoming');
            const tabApproval = document.getElementById('tab-approval');

            if (tabName === 'incoming') {
                tabIncoming.className = "px-6 py-2 text-sm font-medium rounded-lg transition-colors bg-[#3B6EC2] text-white";
                tabApproval.className = "px-6 py-2 text-sm font-medium rounded-lg transition-colors bg-blue-50 text-[#3B6EC2] hover:bg-blue-100";
            } else {
                tabApproval.className = "px-6 py-2 text-sm font-medium rounded-lg transition-colors bg-[#3B6EC2] text-white";
                tabIncoming.className = "px-6 py-2 text-sm font-medium rounded-lg transition-colors bg-blue-50 text-[#3B6EC2] hover:bg-blue-100";
            }
        }
    </script>
</body>

</html>
