<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downline Modal Demo - M-Sales</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-100 flex items-center justify-center h-screen">

    <button onclick="openDownlineModal()"
        class="px-6 py-3 bg-[#3B6EC2] text-white rounded-lg shadow-lg hover:bg-[#2F5BA8] transition-colors">
        Open Downline Modal
    </button>

    <!-- Modal Container -->
    <div id="downlineModal" class="hidden relative z-[100]" aria-labelledby="modal-title" role="dialog"
        aria-modal="true">
        <!-- Backdrop -->
        <div class="fixed inset-0 bg-black/50 transition-opacity" onclick="closeDownlineModal()"></div>

        <!-- Modal Panel -->
        <div class="fixed inset-0 z-10 w-screen overflow-y-auto">
            <div class="flex min-h-full items-center justify-center p-4 text-center sm:p-0">
                <div
                    class="relative transform overflow-hidden rounded-2xl bg-white text-left shadow-2xl transition-all sm:my-8 sm:w-full sm:max-w-4xl">

                    <!-- Header -->
                    <div
                        class="px-6 py-4 border-b border-gray-200 flex items-center justify-between bg-white sticky top-0 z-10">
                        <h2 class="text-xl font-semibold text-gray-800" id="modalTitle">Downline Details</h2>
                        <button onclick="closeDownlineModal()"
                            class="text-gray-400 hover:text-gray-600 transition-colors bg-transparent border-0 cursor-pointer">
                            <i data-lucide="x" class="w-6 h-6"></i>
                        </button>
                    </div>

                    <!-- Tabs -->
                    <div class="px-6 pt-4 bg-white">
                        <div class="flex gap-3">
                            <button onclick="switchTab('data-input')" id="tab-data-input"
                                class="px-4 py-2 text-sm font-medium rounded-lg transition-colors bg-[#3B6EC2] text-white">
                                Data Input
                            </button>
                            <button onclick="switchTab('app-processing')" id="tab-app-processing"
                                class="px-4 py-2 text-sm font-medium rounded-lg transition-colors bg-gray-100 text-gray-600 hover:bg-gray-200">
                                App Processing
                            </button>
                        </div>
                    </div>

                    <!-- Content -->
                    <div class="p-6">
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="modalContent">
                            <!-- Populated by JS -->
                        </div>
                    </div>

                    <!-- Footer -->
                    <div class="px-6 py-4 border-t border-gray-200 bg-gray-50 flex justify-end">
                        <button onclick="closeDownlineModal()"
                            class="px-6 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition-colors font-medium">
                            Close
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Data
        const dataInputStats = {
            edc: { totalInput: 3, pendingSubmit: 1 },
            qris: { totalInput: 5, pendingSubmit: 3 },
            edcQris: { totalInput: 8, pendingSubmit: 4 },
        };

        const appProcessingStats = {
            edc: { received: 354, inprocess: 6, rts: 25, send: 323, pending: 0, cancel: 0 },
            qris: { received: 1533, inprocess: 9, rts: 38, send: 1485, pending: 1, cancel: 0 },
            edcQris: { received: 134, inprocess: 20, rts: 31, send: 77, pending: 6, cancel: 0 },
        };

        let activeTab = 'data-input';

        function renderContent() {
            const container = document.getElementById('modalContent');
            const data = activeTab === 'data-input' ? dataInputStats : appProcessingStats;

            const cards = [
                { title: 'EDC', type: 'edc' },
                { title: 'QRIS', type: 'qris' },
                { title: 'EDC + QRIS', type: 'edcQris' }
            ];

            container.innerHTML = cards.map(card => {
                const stats = data[card.type];
                let contentHTML = '';

                if (activeTab === 'data-input') {
                    contentHTML = `
                        <div class="space-y-4">
                            <div class="flex justify-between items-center pb-3 border-b border-gray-200">
                                <span class="text-sm text-gray-600">Total Input</span>
                                <span class="text-xl font-semibold text-gray-800">${stats.totalInput}</span>
                            </div>
                            <div class="flex justify-between items-center">
                                <span class="text-sm text-gray-600">Pending Submit</span>
                                <span class="text-xl font-semibold text-gray-800">${stats.pendingSubmit}</span>
                            </div>
                        </div>
                    `;
                } else {
                    contentHTML = `
                        <div class="space-y-3">
                            <div class="flex justify-between items-center pb-2 border-b border-gray-200">
                                <span class="text-sm text-gray-600">Received</span>
                                <span class="text-lg font-semibold text-gray-800">${stats.received}</span>
                            </div>
                            <div class="flex justify-between items-center pb-2 border-b border-gray-200">
                                <span class="text-sm text-gray-600">Inprocess</span>
                                <span class="text-lg font-semibold text-gray-800">${stats.inprocess}</span>
                            </div>
                            <div class="flex justify-between items-center pb-2 border-b border-gray-200">
                                <span class="text-sm text-gray-600">RTS</span>
                                <span class="text-lg font-semibold text-gray-800">${stats.rts}</span>
                            </div>
                            <div class="flex justify-between items-center pb-2 border-b border-gray-200">
                                <span class="text-sm text-gray-600">Send</span>
                                <span class="text-lg font-semibold text-gray-800">${stats.send}</span>
                            </div>
                            <div class="flex justify-between items-center pb-2 border-b border-gray-200">
                                <span class="text-sm text-gray-600">Pending</span>
                                <span class="text-lg font-semibold text-gray-800">${stats.pending}</span>
                            </div>
                            <div class="flex justify-between items-center">
                                <span class="text-sm text-gray-600">Cancel</span>
                                <span class="text-lg font-semibold text-gray-800">${stats.cancel}</span>
                            </div>
                        </div>
                    `;
                }

                return `
                    <div class="bg-white rounded-lg border border-gray-200 overflow-hidden shadow-sm">
                        <div class="bg-[#3B6EC2] px-4 py-3 text-center">
                            <h3 class="text-base font-semibold text-white">${card.title}</h3>
                        </div>
                        <div class="p-6">
                            ${contentHTML}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function switchTab(tab) {
            activeTab = tab;
            const tabDataInput = document.getElementById('tab-data-input');
            const tabAppProcessing = document.getElementById('tab-app-processing');

            if (tab === 'data-input') {
                tabDataInput.className = 'px-4 py-2 text-sm font-medium rounded-lg transition-colors bg-[#3B6EC2] text-white';
                tabAppProcessing.className = 'px-4 py-2 text-sm font-medium rounded-lg transition-colors bg-gray-100 text-gray-600 hover:bg-gray-200';
            } else {
                tabAppProcessing.className = 'px-4 py-2 text-sm font-medium rounded-lg transition-colors bg-[#3B6EC2] text-white';
                tabDataInput.className = 'px-4 py-2 text-sm font-medium rounded-lg transition-colors bg-gray-100 text-gray-600 hover:bg-gray-200';
            }
            renderContent();
        }

        function openDownlineModal() {
            document.getElementById('downlineModal').classList.remove('hidden');
            renderContent();
        }

        function closeDownlineModal() {
            document.getElementById('downlineModal').classList.add('hidden');
        }

        // Initialize Icons
        lucide.createIcons();
    </script>
</body>

</html>
