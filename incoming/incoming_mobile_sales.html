        appContainer.appendChild(main);

        // Mock Data
        const data = [
            {
                no: 1,
                rsmName: "Ramaldo Oktarna",
                nikSales: "KT104148",
                branch: "Jakarta Pusat",
                totalDSRActive: 15,

        let currentPage = 1;
        let rowsPerPage = 10;

        function renderTable() {
            const start = (currentPage - 1) * rowsPerPage;
            const end = start + rowsPerPage;
            const paginatedItems = data.slice(start, end);
            const tbody = document.getElementById("tableBody");

            if (paginatedItems.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-gray-500">No data found</td></tr>';
                return;
            }

            tbody.innerHTML = paginatedItems.map((row, index) => `
            <tr class="border-b border-gray-200 hover:bg-gray-50">
                <td class="px-4 py-3 text-sm">${start + index + 1}</td>
                <td class="px-4 py-3 text-sm">${row.rsmName}</td>
                <td class="px-4 py-3 text-sm">${row.nikSales}</td>
                <td class="px-4 py-3 text-sm">${row.branch}</td>
                <td class="px-4 py-3 text-sm text-center">${row.totalDSRActive}</td>
                <td class="px-4 py-3 text-sm text-center">${row.submitBCA}</td>
                <td class="px-4 py-3 text-sm text-center">
                    <button onclick="openActionModal('${row.rsmName}')" class="text-[#3B6EC2] hover:text-[#2F5BA8] transition-colors">
                        <i data-lucide="eye" class="w-5 h-5 mx-auto"></i>
                    </button>
                </td>
            </tr>
            `).join("");
        }

        function renderPagination() {
            const totalPages = Math.ceil(data.length / rowsPerPage);
            const showingInfo = document.getElementById("showingInfo");
            const paginationControls = document.getElementById("paginationControls");

            const start = data.length === 0 ? 0 : (currentPage - 1) * rowsPerPage + 1;
            const end = Math.min(currentPage * rowsPerPage, data.length);
            showingInfo.textContent = `Showing ${start} to ${end} of ${data.length}`;

            let controlsHtml = `
                <button onclick="changePage(${currentPage - 1})" class="p-1 hover:text-gray-700 text-gray-400 transition-colors ${currentPage === 1 ? "opacity-50 cursor-not-allowed" : ""}" ${currentPage === 1 ? "disabled" : ""}>
                    <i data-lucide="chevron-left" class="w-4 h-4"></i>
                </button>
            `;

            for (let i = 1; i <= totalPages; i++) {
                if (i === currentPage) {
                    controlsHtml += `<span class="w-8 h-8 flex items-center justify-center bg-blue-100 text-blue-600 font-medium rounded-lg">${i}</span>`;
                } else {
                    controlsHtml += `<button onclick="changePage(${i})" class="w-8 h-8 flex items-center justify-center hover:bg-gray-100 text-gray-600 rounded-lg transition-colors">${i}</button>`;
                }
            }

            controlsHtml += `
                <button onclick="changePage(${currentPage + 1})" class="p-1 hover:text-gray-700 text-gray-400 transition-colors ${currentPage === totalPages || totalPages === 0 ? "opacity-50 cursor-not-allowed" : ""}" ${currentPage === totalPages || totalPages === 0 ? "disabled" : ""}>
                    <i data-lucide="chevron-right" class="w-4 h-4"></i>
                </button>
            `;

            paginationControls.innerHTML = controlsHtml;
            lucide.createIcons();
        }

        window.changePage = function (page) {
            const totalPages = Math.ceil(data.length / rowsPerPage);
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderTable();
            renderPagination();
        };

        window.handleRowsPerPageChange = function (value) {
            rowsPerPage = parseInt(value);
            currentPage = 1;
            renderTable();
            renderPagination();
        };

        // Initial Render
        renderTable();
        renderPagination();

        // Date Range Picker Logic
        window.toggleDateRangePicker = function (event) {
            if (event) event.stopPropagation();
            const picker = document.getElementById("dateRangePicker");
            picker.classList.toggle("hidden");
        };

        // Modal Logic
        window.openActionModal = function (name) {
            const modal = document.getElementById('actionModal');
            const title = document.getElementById('actionModalTitle');

            title.textContent = name;
            modal.classList.remove('hidden');

            // Animation
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modal.querySelector('div').classList.remove('scale-95');
                modal.querySelector('div').classList.add('scale-100');
            }, 10);

            lucide.createIcons();
        }

        window.closeActionModal = function () {
            const modal = document.getElementById('actionModal');
            modal.classList.add('opacity-0');
            modal.querySelector('div').classList.remove('scale-100');
            modal.querySelector('div').classList.add('scale-95');

            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        document.addEventListener("click", function (event) {
            const datePicker = document.getElementById("dateRangePicker");
            const dateInput = event.target.closest(
                '[onclick*="toggleDateRangePicker"]'
            );
            if (
                datePicker &&
                !datePicker.classList.contains("hidden") &&
                !datePicker.contains(event.target) &&
                !dateInput
            ) {
                datePicker.classList.add("hidden");
            }
        });

        lucide.createIcons();
    </script>
</body>

</html>
