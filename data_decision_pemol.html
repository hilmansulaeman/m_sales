        document.getElementById("detailModal").classList.remove("hidden");
        renderModalTable();
        lucide.createIcons(); // Re-init icons inside modal
      };

      window.closeDetailModal = function () {
        document.getElementById("detailModal").classList.add("hidden");
      };

      function renderModalTable() {
        const modalTbody = document.getElementById("modalTableBody");
        modalTbody.innerHTML = asmData
          .map(
            (item, index) => `
                <tr class="border-b border-gray-200 hover:bg-gray-50">
                    <td class="px-4 py-3 text-sm text-gray-700 text-center">${
                      index + 1
                    }</td>
                    <td class="px-4 py-3 text-sm text-gray-700 text-center font-medium">${
                      item.asmName
                    }</td>
                    <td class="px-4 py-3 text-sm text-gray-700 text-center">${
                      item.nikSales
                    }</td>
                    <td class="px-4 py-3 text-sm text-gray-700 text-center border-l border-gray-200">${
                      item.myBCA
                    }</td>
                    <td class="px-4 py-3 text-sm text-gray-700 text-center">${
                      item.mobileBCA
                    }</td>
                    <td class="px-4 py-3 text-sm text-gray-700 text-center border-l border-gray-200">${
                      item.ne
                    }</td>
                    <td class="px-4 py-3 text-sm text-gray-700 text-center border-l border-gray-200">${
                      item.sk
                    }</td>
                    <td class="px-4 py-3 text-sm text-gray-700 text-center border-l border-gray-200">${
                      item.ktb
                    }</td>
                    <td class="px-4 py-3 text-sm font-semibold text-gray-900 text-center border-l border-gray-200">${
                      item.total
                    }</td>
                </tr>
            `
          )
          .join("");
      }

      // Date Range Picker Logic
      window.toggleDateRangePicker = function (event) {
        if (event) event.stopPropagation();
        const picker = document.getElementById("dateRangePicker");
        picker.classList.toggle("hidden");
      };

      document.addEventListener("click", function (event) {
        const datePicker = document.getElementById("dateRangePicker");
        const dateInput = event.target.closest(
          '[onclick*="toggleDateRangePicker"]'
        );
        if (
          datePicker &&
          !datePicker.classList.contains("hidden") &&
          !datePicker.contains(event.target) &&
          !dateInput
        ) {
          datePicker.classList.add("hidden");
        }
      });

      lucide.createIcons();
    </script>
  </body>
</html>
