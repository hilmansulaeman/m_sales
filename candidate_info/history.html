<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>History - M-Sales</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../js/layout.js"></script>
    <link href="https://fonts.cdnfonts.com/css/tiktok-sans" rel="stylesheet" />
    <style>
      body {
        font-family: "TikTok Sans", sans-serif;
      }
    </style>
  </head>

  <body>
    <div id="app"></div>

    <script>
      initLayout("Candidate Info", "History");

      const appContainer = document.querySelector("#app > div > div");
      const main = document.createElement("div");
      main.className = "flex-1 bg-gray-50 flex flex-col";

      main.innerHTML = `
            <!-- Header -->
            <div class="bg-white border-b border-gray-200 px-6 py-4">
                <h1 class="text-2xl font-semibold text-[#3B6EC2]">History</h1>
            </div>

            <!-- Content -->
            <div class="flex-1 p-6">
                <!-- Table Card -->
                <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
                    
                    <!-- Table Container -->
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm text-left border-collapse">
                            <thead>
                                <tr class="bg-[#1E5BBC] text-white">
                                    <th class="px-4 py-3 font-semibold text-center border-r border-blue-400 w-16">No</th>
                                    <th class="px-4 py-3 font-semibold text-left">Candidate Information</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-200 bg-white text-gray-700">
                                <tr class="hover:bg-gray-50">
                                    <td class="px-4 py-4 text-center">1</td>
                                    <td class="px-4 py-4">-</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination -->
                    <div class="px-4 py-4 border-t border-gray-200 flex flex-col sm:flex-row items-center justify-between gap-4">
                        <div class="text-xs text-gray-500">
                            Showing 1 to 1 of 1
                        </div>

                        <div class="flex items-center gap-4">
                            <!-- Page Numbers -->
                            <div class="flex items-center gap-1">
                                <button class="p-1 rounded hover:bg-gray-100 text-gray-400 disabled:opacity-50" disabled>
                                    <i data-lucide="chevron-left" class="w-4 h-4"></i>
                                </button>
                                <button class="w-6 h-6 flex items-center justify-center bg-blue-50 text-blue-600 rounded text-xs font-medium">1</button>
                                <button class="p-1 rounded hover:bg-gray-100 text-gray-400 disabled:opacity-50" disabled>
                                    <i data-lucide="chevron-right" class="w-4 h-4"></i>
                                </button>
                            </div>

                            <!-- Per Page -->
                            <div class="flex items-center gap-2">
                                <span class="text-xs text-gray-500">Show</span>
                                <select class="appearance-none bg-white border border-gray-300 text-gray-700 py-1 pl-2 pr-6 rounded text-xs focus:outline-none focus:ring-1 focus:ring-blue-500 cursor-pointer">
                                    <option>10</option>
                                    <option>25</option>
                                    <option>50</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        `;

      appContainer.appendChild(main);
      lucide.createIcons();
    </script>
  </body>
</html>
