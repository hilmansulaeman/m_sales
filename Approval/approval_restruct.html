<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restruct - M-Sales</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../js/layout.js"></script>
    <link href="https://fonts.cdnfonts.com/css/tiktok-sans" rel="stylesheet" />
    <style>
        body {
            font-family: "TikTok Sans", sans-serif;
        }
    </style>
</head>

<body>
    <div id="app"></div>

    <script>
        initLayout("Approval", "Restruct");

        const appContainer = document.querySelector("#app > div > div");
        const main = document.createElement("div");
        main.className = "flex-1 bg-gray-50 flex flex-col";

        main.innerHTML = `
            

            <!-- Content -->
            <div class="flex-1 p-6">
                <!-- Data Card -->
                <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
                    
                    <!-- Search Bar -->
                    <div class="p-4 border-b border-gray-100 flex items-center justify-between gap-4">
                        <div class="relative w-full">
                            <i data-lucide="search" class="absolute left-3 top-1/2 transform -translate-y-1/2 w-4 h-4 text-gray-400"></i>
                            <input type="text" placeholder="Search" class="w-full pl-10 pr-4 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-blue-500 transition-colors">
                        </div>
                    </div>

                    <!-- Table Container -->
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm text-center border-collapse">
                            <thead>
                                <tr class="bg-[#1E5BBC] text-white">
                                    <th class="px-4 py-3 font-semibold border-r border-blue-400 w-16">No</th>
                                    <th class="px-4 py-3 font-semibold border-r border-blue-400">Effective Date</th>
                                    <th class="px-4 py-3 font-semibold border-r border-blue-400">Date Created</th>
                                    <th class="px-4 py-3 font-semibold border-r border-blue-400">Created By</th>
                                    <th class="px-4 py-3 font-semibold border-r border-blue-400">Data Amount</th>
                                    <th class="px-4 py-3 font-semibold border-r border-blue-400">Approved</th>
                                    <th class="px-4 py-3 font-semibold border-r border-blue-400">Rejected</th>
                                    <th class="px-4 py-3 font-semibold">Action</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-200 bg-white text-gray-700">
                                <tr class="hover:bg-gray-50">
                                    <td class="px-4 py-4">1</td>
                                    <td class="px-4 py-4 text-blue-600">-</td>
                                    <td class="px-4 py-4 text-blue-600">-</td>
                                    <td class="px-4 py-4 text-blue-600">-</td>
                                    <td class="px-4 py-4 text-blue-600">-</td>
                                    <td class="px-4 py-4 text-blue-600">-</td>
                                    <td class="px-4 py-4 text-blue-600">-</td>
                                    <td class="px-4 py-4 text-blue-600">-</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination -->
                    <div class="px-4 py-4 border-t border-gray-200 flex flex-col sm:flex-row items-center justify-between gap-4">
                        <div class="text-xs text-gray-500">
                            Showing 1 to 1 of 1
                        </div>

                        <div class="flex items-center gap-4">
                            <!-- Page Numbers -->
                            <div class="flex items-center gap-1">
                                <button class="p-1 rounded hover:bg-gray-100 text-gray-400 disabled:opacity-50" disabled>
                                    <i data-lucide="chevron-left" class="w-4 h-4"></i>
                                </button>
                                <button class="w-6 h-6 flex items-center justify-center bg-blue-50 text-blue-600 rounded text-xs font-medium">1</button>
                                <button class="p-1 rounded hover:bg-gray-100 text-gray-400 disabled:opacity-50" disabled>
                                    <i data-lucide="chevron-right" class="w-4 h-4"></i>
                                </button>
                            </div>

                            <!-- Per Page -->
                            <div class="flex items-center gap-2">
                                <span class="text-xs text-gray-500">Show</span>
                                <select class="appearance-none bg-white border border-gray-300 text-gray-700 py-1 pl-2 pr-6 rounded text-xs focus:outline-none focus:ring-1 focus:ring-blue-500 cursor-pointer">
                                    <option>10</option>
                                    <option>25</option>
                                    <option>50</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        `;

        appContainer.appendChild(main);
        lucide.createIcons();
    </script>
</body>

</html>
